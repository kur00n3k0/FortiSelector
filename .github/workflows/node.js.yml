name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      - name: Auditoria de segurança
        run: npm audit --audit-level=moderate

      - name: Seed do banco de dados
        run: npm run seed:all

      - name: Iniciar servidor
        run: node server.js &

      - name: Aguardar servidor estar pronto
        run: until curl -sf http://localhost:3000/ > /dev/null; do sleep 1; done

      - name: Smoke tests da API
        run: npm run smoke
